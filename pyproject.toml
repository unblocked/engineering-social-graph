[tool.poetry]
name = "social-graph"
version = "0.1.0"
description = "Build a company social graph from PR history to identify domain experts"
authors = ["Next Chapter Software Inc. (Unblocked)"]
readme = "README.md"
packages = [{include = "social_graph", from = "src"}]

[tool.poetry.scripts]
social-graph = "social_graph.cli:cli"

[tool.poetry.dependencies]
python = "^3.11"
click = "^8.0"
requests = "^2.31"
rich = "^13.0"
networkx = "^3.0"

[tool.poetry.group.llm.dependencies]
anthropic = ">=0.30"

[tool.poetry.group.keyring.dependencies]
keyring = ">=24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = ">=0.4"
pyinstaller = {version = "^6.15", python = ">=3.11,<3.15"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "social-graph"
version = "0.1.0"
description = "Build a company social graph from PR history to identify domain experts"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Next Chapter Software Inc. (Unblocked)" },
]
dependencies = [
    "click>=8.0,<9",
    "requests>=2.31,<3",
    "rich>=13.0,<14",
    "networkx>=3.0,<4",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.30",
]
keyring = [
    "keyring>=24.0",
]

[project.scripts]
social-graph = "social_graph.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4",
    "pyinstaller>=6.15,<7; python_version >= '3.11' and python_version < '3.15'",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_graph"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
